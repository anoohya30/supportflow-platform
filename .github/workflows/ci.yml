# CI pipeline: runs automatically on every pull request to main
# and on every push to main.
#
# Jobs:
#   1. lint-and-test  - code style, database migration check, 19 tests
#   2. secret-scan    - fails if a password/key is found in the code or history
#   3. build-and-scan - builds the Docker image and fails on fixable CRITICAL
#                       vulnerabilities
#
# Security rules from the brief:
#   - third-party actions are pinned to an exact commit SHA (immutable)
#   - the workflow only gets read access to the repository
#   - no cloud credentials or secrets are used here

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# If you push again to the same PR, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A throwaway PostgreSQL database just for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://supportflow:supportflow@localhost:5432/supportflow_test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migration check (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the whole Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  build-and-scan:
    name: Build image and scan for vulnerabilities
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed yet - ECR comes later)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: supportflow:${{ github.sha }}
          build-args: |
            APP_VERSION=0.1.0
            GIT_COMMIT=${{ github.sha }}

      - name: Check the image runs as non-root
        run: |
          user=$(docker image inspect supportflow:${{ github.sha }} --format '{{.Config.User}}')
          echo "Image user: $user"
          test "$user" = "10001:10001"

      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supportflow:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
