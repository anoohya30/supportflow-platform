{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller (Traefik, in kube-system), the node itself
# (for health probes) and Prometheus (in the monitoring namespace, for
# /metrics) may reach the API pods. Everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "supportflow.fullname" . }}-allow-ingress
  labels:
    {{- include "supportflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "supportflow.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- with .Values.networkPolicy.monitoringNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.nodeCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
